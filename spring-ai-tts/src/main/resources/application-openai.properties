# OpenAI Configuration Profile
# Activate with: export SPRING_PROFILES_ACTIVE=openai

# Select OpenAI as the TTS and Transcription provider
spring.ai.model.audio.speech=openai
spring.ai.model.audio.transcription=openai
spring.ai.model.chat=openai

# OpenAI API Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}

# OpenAI Chat Options
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# OpenAI TTS Options
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=alloy
spring.ai.openai.audio.speech.options.response-format=mp3
spring.ai.openai.audio.speech.options.speed=1.0

# OpenAI Transcription Options
spring.ai.openai.audio.transcription.options.model=gpt-4o-mini-transcribe
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.temperature=0.0
