# ElevenLabs TTS Configuration Profile
# Activate with: export SPRING_PROFILES_ACTIVE=elevenlabs
# Hybrid setup: ElevenLabs for TTS, OpenAI for Transcription and Chat

# Select ElevenLabs as the TTS provider
spring.ai.model.audio.speech=elevenlabs

# Select OpenAI for Transcription and Chat
spring.ai.model.audio.transcription=openai
spring.ai.model.chat=openai

# ElevenLabs API Configuration
spring.ai.elevenlabs.api-key=${ELEVEN_LABS_API_KEY}

# ElevenLabs TTS Options
spring.ai.elevenlabs.tts.options.model-id=eleven_turbo_v2_5
spring.ai.elevenlabs.tts.options.voice-id=9BWtsMINqrJLrRacOk9x
spring.ai.elevenlabs.tts.options.output-format=mp3_44100_128

# OpenAI API Configuration (for Transcription and Chat)
spring.ai.openai.api-key=${OPENAI_API_KEY}

# OpenAI Chat Options
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# OpenAI Transcription Options
spring.ai.openai.audio.transcription.options.model=gpt-4o-mini-transcribe
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.temperature=0.0
